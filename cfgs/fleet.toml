# A list of sections: one [[servers]] table per item, its own section [servers.tls] right after it.
name = "fleet"

[[servers]]
host = "web-1.internal"
port = 8080
workers = 4
open_ports = [80, 443]

[servers.tls]
enabled = true
cert_path = "/etc/ssl/web-1.pem"
key_path = "/etc/ssl/web-1.key"

[[servers]]
host = "web-2.internal"
port = 8081
workers = 2
open_ports = []

[servers.tls]
enabled = false
cert_path = ""
key_path = ""

[[servers]]
host = "db-1.internal"
port = 5432
workers = 8
open_ports = [5432]

[servers.tls]
enabled = true
cert_path = "/etc/ssl/db-1.pem"
key_path = "/etc/ssl/db-1.key"
